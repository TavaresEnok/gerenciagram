name: gerenciador

# ============================================================================
#  Rede isolada com subnet FIXA.
#
#  Sem isto, o Docker aloca redes a partir do pool padrão 172.17.0.0/12, que
#  contém a faixa 172.22.144.0/20 usada pelo vEthernet (Default Switch) do
#  Hyper-V nesta máquina — a colisão derruba a rede do host de forma
#  intermitente. Ver DEPLOYMENT.md > "Conflito de IP".
# ============================================================================
networks:
  gerenciador:
    name: gerenciador_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_SUBNET:-10.201.10.0/24}
          gateway: ${DOCKER_GATEWAY:-10.201.10.1}

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gerenciador_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gerenciador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-gerenciador}
      # Necessário para o teste de restauração de backup (SPEC seção 15)
      POSTGRES_INITDB_ARGS: '--data-checksums'
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gerenciador
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gerenciador} -d ${POSTGRES_DB:-gerenciador}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gerenciador_redis
    restart: unless-stopped
    # appendonly: jobs agendados não podem sumir se o container reiniciar
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    networks:
      - gerenciador
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: gerenciador_minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${MINIO_PORT:-9000}:9000'
      - '${BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    networks:
      - gerenciador
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Cria o bucket na primeira subida e sai. Sem isto o upload falha no
  # primeiro uso — "passo manual escondido" que a SPEC (seção 18) proíbe.
  minio-init:
    image: minio/mc:latest
    container_name: gerenciador_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
      S3_BUCKET: ${S3_BUCKET:-gerenciador-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      (mc ls local/$${S3_BUCKET} >/dev/null 2>&1 || mc mb local/$${S3_BUCKET}) &&
      mc anonymous set none local/$${S3_BUCKET} &&
      echo 'bucket pronto: '$${S3_BUCKET}
      "
    networks:
      - gerenciador
    restart: 'no'

  # --------------------------------------------------------------------------
  # Captura e-mails em dev (verificação de conta, reset de senha, notificações).
  # Não envia nada para fora — UI em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: gerenciador_mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${BIND_ADDR:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025'
    networks:
      - gerenciador

  # ==========================================================================
  #  Aplicação — profile "full".
  #
  #  Por padrão o compose sobe só a infra e você roda as apps no host com
  #  hot reload (`pnpm dev`). Para subir tudo em container:
  #     docker compose --profile full up -d
  # ==========================================================================
  api:
    profiles: ['full']
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: dev
    container_name: gerenciador_api
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      REDIS_URL: ${REDIS_URL_DOCKER}
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      HOST: 0.0.0.0
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - gerenciador
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    profiles: ['full']
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
      target: dev
    container_name: gerenciador_worker
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      REDIS_URL: ${REDIS_URL_DOCKER}
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - gerenciador

  web:
    profiles: ['full']
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      target: dev
    container_name: gerenciador_web
    restart: unless-stopped
    env_file: ../../.env
    environment:
      # O navegador do host resolve a API por localhost, não pelo DNS do compose
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
      HOSTNAME: 0.0.0.0
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    depends_on:
      - api
    networks:
      - gerenciador
