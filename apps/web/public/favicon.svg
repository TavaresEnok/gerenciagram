<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Gerenciador de Redes Sociais">
  <rect width="32" height="32" rx="7" fill="#18181b"/>
  <!-- Três nós ligados a um centro: uma publicação, vários destinos. -->
  <circle cx="16" cy="16" r="3.2" fill="#fafafa"/>
  <circle cx="8" cy="9" r="2.2" fill="#fafafa" opacity=".75"/>
  <circle cx="24" cy="9" r="2.2" fill="#fafafa" opacity=".75"/>
  <circle cx="16" cy="25" r="2.2" fill="#fafafa" opacity=".75"/>
  <g stroke="#fafafa" stroke-width="1.3" opacity=".5">
    <line x1="16" y1="16" x2="8" y2="9"/>
    <line x1="16" y1="16" x2="24" y2="9"/>
    <line x1="16" y1="16" x2="16" y2="25"/>
  </g>
</svg>
